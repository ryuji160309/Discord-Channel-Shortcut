<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Discord Shortcuts</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FEF7FF" media="(prefers-color-scheme: light)">

  <!-- Google Fonts: Roboto & Material Symbols (Android標準) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      /* M3 Light (Android 16/17 トーン準拠) */
      --md-sys-color-background: #FEF7FF;
      --md-sys-color-on-background: #1D1B20;
      --md-sys-color-surface: #FEF7FF;
      --md-sys-color-surface-container: #F3EDF7;
      --md-sys-color-surface-container-high: #ECE6F0;
      --md-sys-color-on-surface: #1D1B20;
      --md-sys-color-on-surface-variant: #49454F;
      --md-sys-color-primary: #65558F;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #E8DEF8;
      --md-sys-color-on-primary-container: #210F47;
      --md-sys-color-outline: #79747E;
      --md-sys-color-outline-variant: #CAC4D0;
      --md-sys-color-error: #BA1A1A;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* M3 Dark */
        --md-sys-color-background: #141218;
        --md-sys-color-on-background: #E6E0E9;
        --md-sys-color-surface: #141218;
        --md-sys-color-surface-container: #211F26;
        --md-sys-color-surface-container-high: #2B2930;
        --md-sys-color-on-surface: #E6E0E9;
        --md-sys-color-on-surface-variant: #CAC4D0;
        --md-sys-color-primary: #D0BCFF;
        --md-sys-color-on-primary: #381E72;
        --md-sys-color-primary-container: #4F378B;
        --md-sys-color-on-primary-container: #EADDFF;
        --md-sys-color-outline: #938F99;
        --md-sys-color-outline-variant: #49454F;
        --md-sys-color-error: #FFB4AB;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      font-family: 'Roboto', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      padding: 16px 24px;
      font-size: 22px;
      font-weight: 500;
      background-color: var(--md-sys-color-surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    main {
      flex: 1;
      padding: 8px 16px 96px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      position: relative;
    }

    /* リストカード */
    .card {
      background-color: var(--md-sys-color-surface-container);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      touch-action: pan-y;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      position: relative;
    }

    .card:active:not(.dragging) {
      transform: scale(0.98);
      background-color: var(--md-sys-color-surface-container-high);
    }

    /* 並び替え中（長押し時）のスタイル */
    .card.dragging {
      opacity: 0.9;
      transform: scale(1.03);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
      z-index: 100;
      background-color: var(--md-sys-color-primary-container);
    }

    .card-info {
      flex: 1;
      overflow: hidden;
      padding-right: 8px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-url {
      font-size: 12px;
      color: var(--md-sys-color-outline);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 三点リーダー（縦）ボタン */
    .btn-more {
      background: none;
      border: none;
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-more:active {
      background-color: rgba(255, 255, 255, 0.1);
    }

    /* FAB */
    .fab {
      position: fixed;
      right: 16px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.1s ease;
      z-index: 50;
    }

    .fab:active {
      transform: scale(0.92);
    }

    /* M3 ダイアログ & キーボード被り防止 */
    dialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      border: none;
      border-radius: 28px;
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      padding: 24px;
      width: calc(100% - 48px);
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      max-height: 90dvh;
      overflow-y: auto;
    }

    dialog::backdrop {
      background-color: rgba(0, 0, 0, 0.5);
    }

    dialog h3 {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .input-group input {
      background: transparent;
      border: 1.5px solid var(--md-sys-color-outline);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      color: var(--md-sys-color-on-surface);
      outline: none;
      user-select: text;
    }

    .input-group input:focus {
      border-color: var(--md-sys-color-primary);
      border-width: 2px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }

    .dialog-actions button {
      background: none;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 20px;
      cursor: pointer;
      color: var(--md-sys-color-primary);
    }

    .dialog-actions button:active {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .dialog-actions button.btn-delete {
      color: var(--md-sys-color-error);
      margin-right: auto;
    }
  </style>
</head>
<body>

  <header>Discord Shortcuts</header>

  <main id="channelList"></main>

  <button class="fab" id="openAddDialog" aria-label="追加">
    <span class="material-symbols-outlined">add</span>
  </button>

  <!-- 追加・編集モーダル -->
  <dialog id="editDialog">
    <h3 id="dialogTitle">チャンネルを追加</h3>
    <div class="input-group">
      <input type="text" id="inputTitle" placeholder="表示名 (例: 雑談部屋)" autocomplete="off">
      <input type="url" id="inputUrl" placeholder="リンク (例: https://discord.com/...)" autocomplete="off">
    </div>
    <div class="dialog-actions">
      <button class="btn-delete" id="btnDelete" style="display: none;">削除</button>
      <button id="btnCancel">キャンセル</button>
      <button id="btnSave">保存</button>
    </div>
  </dialog>

  <script>
    const STORAGE_KEY = 'discord_shortcuts_data';
    let channels = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let currentEditId = null;

    const listContainer = document.getElementById('channelList');
    const dialog = document.getElementById('editDialog');
    const inputTitle = document.getElementById('inputTitle');
    const inputUrl = document.getElementById('inputUrl');
    const btnDelete = document.getElementById('btnDelete');

    function saveChannels() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(channels));
      render();
    }

    function render() {
      listContainer.innerHTML = '';
      channels.forEach((ch, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.id = ch.id;
        card.dataset.index = index;

        card.innerHTML = `
          <div class="card-info">
            <div class="card-title">${escapeHtml(ch.title)}</div>
            <div class="card-url">${escapeHtml(ch.url)}</div>
          </div>
          <button class="btn-more" data-id="${ch.id}" aria-label="操作メニュー">
            <span class="material-symbols-outlined">more_vert</span>
          </button>
        `;

        // 即時遷移
        card.addEventListener('click', (e) => {
          if (e.target.closest('.btn-more') || card.classList.contains('was-dragging')) return;
          window.location.href = ch.url;
        });

        // 縦三点リーダー（編集/削除メニュー）
        card.querySelector('.btn-more').addEventListener('click', (e) => {
          e.stopPropagation();
          openDialog(ch);
        });

        // 長押し並び替えイベント設定
        attachDragEvents(card);

        listContainer.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // --- 長押しドラッグ並び替え制御 ---
    function attachDragEvents(element) {
      let timer = null;
      let isDragging = false;
      let startY = 0;
      let originalIndex = 0;

      const onTouchStart = (e) => {
        if (e.target.closest('.btn-more')) return;
        startY = e.touches[0].clientY;
        originalIndex = parseInt(element.dataset.index, 10);

        timer = setTimeout(() => {
          isDragging = true;
          if (navigator.vibrate) navigator.vibrate(40); // 触覚フィードバック
          element.classList.add('dragging');
        }, 350); // 350ms長押しでドラッグ発火
      };

      const onTouchMove = (e) => {
        if (!isDragging) {
          if (Math.abs(e.touches[0].clientY - startY) > 10) {
            clearTimeout(timer);
          }
          return;
        }

        e.preventDefault();
        const currentY = e.touches[0].clientY;
        element.style.transform = `translateY(${currentY - startY}px) scale(1.03)`;

        // 重なり要素の検出と並び替え
        const siblings = [...listContainer.querySelectorAll('.card:not(.dragging)')];
        const target = siblings.find(sib => {
          const rect = sib.getBoundingClientRect();
          return currentY >= rect.top && currentY <= rect.bottom;
        });

        if (target) {
          const targetIndex = parseInt(target.dataset.index, 10);
          if (targetIndex !== originalIndex) {
            const moved = channels.splice(originalIndex, 1)[0];
            channels.splice(targetIndex, 0, moved);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(channels));
            render();
            return;
          }
        }
      };

      const onTouchEnd = () => {
        clearTimeout(timer);
        if (isDragging) {
          isDragging = false;
          element.classList.remove('dragging');
          element.classList.add('was-dragging');
          setTimeout(() => element.classList.remove('was-dragging'), 100);
          element.style.transform = '';
          saveChannels();
        }
      };

      element.addEventListener('touchstart', onTouchStart, { passive: true });
      element.addEventListener('touchmove', onTouchMove, { passive: false });
      element.addEventListener('touchend', onTouchEnd);
      element.addEventListener('touchcancel', onTouchEnd);
    }

    // --- ダイアログ制御 ---
    function openDialog(item = null) {
      currentEditId = item ? item.id : null;
      document.getElementById('dialogTitle').textContent = item ? 'チャンネルを編集' : 'チャンネルを追加';
      inputTitle.value = item ? item.title : '';
      inputUrl.value = item ? item.url : '';
      btnDelete.style.display = item ? 'inline-block' : 'none';
      dialog.showModal();

      // フォーカス時にソフトキーボード上へスクロール確保
      setTimeout(() => {
        inputTitle.focus();
        inputTitle.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 150);
    }

    document.getElementById('openAddDialog').addEventListener('click', () => openDialog());
    document.getElementById('btnCancel').addEventListener('click', () => dialog.close());

    document.getElementById('btnSave').addEventListener('click', () => {
      const title = inputTitle.value.trim();
      const url = inputUrl.value.trim();
      if (!title || !url) return;

      if (currentEditId) {
        channels = channels.map(c => c.id === currentEditId ? { ...c, title, url } : c);
      } else {
        channels.push({ id: Date.now().toString(), title, url });
      }
      saveChannels();
      dialog.close();
    });

    btnDelete.addEventListener('click', () => {
      if (currentEditId) {
        channels = channels.filter(c => c.id !== currentEditId);
        saveChannels();
        dialog.close();
      }
    });

    // PWA Service Worker 登録
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    render();
  </script>
</body>
</html>
